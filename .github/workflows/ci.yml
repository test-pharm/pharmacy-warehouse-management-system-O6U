name: Flutter CI/CD

on:
  push:
    branches: [ main ]

jobs:

  # ─────────────────────────────────────────
  # JOB 1: Analyze & Test (Linux - fast)
  # ─────────────────────────────────────────
  analyze:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze
        continue-on-error: true

      - name: Run tests
        run: flutter test
        continue-on-error: true

  # ─────────────────────────────────────────
  # JOB 2: Build Windows EXE & Release
  # ─────────────────────────────────────────
  build-and-release:
    name: Build & Release
    runs-on: windows-latest
    needs: analyze
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows EXE
        run: flutter build windows --release

      - name: Zip the build output
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath pharmacy-wms-windows.zip

      - name: Read version from version.json
        id: version
        shell: powershell
        run: |
          $json = Get-Content version.json -Raw | ConvertFrom-Json
          echo "current=$($json.latestVersion)" >> $env:GITHUB_OUTPUT
          echo "currentBuild=$($json.latestBuildNumber)" >> $env:GITHUB_OUTPUT
          echo "Version: v$($json.latestVersion) (build $($json.latestBuildNumber))"

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.current }}
          name: v${{ steps.version.outputs.current }}
          files: pharmacy-wms-windows.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}